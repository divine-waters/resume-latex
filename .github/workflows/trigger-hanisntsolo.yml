# .github/workflows/trigger-divine-waters.yml
name: trigger-divine-waters-flow

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC  # '0 0/12 * * *'  # Every 12 Hours
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call dispatch on divine-waters branch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}  # PAT with repo + workflow scopes
          repository: ${{ github.repository }}
          event-type: trigger-divine-waters
          client-payload: '{"ref": "divine-waters"}'
